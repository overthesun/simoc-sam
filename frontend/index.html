<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIMOC Live</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="vendor/flatpickr.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1><img src="simoc-logo.svg" alt="SIMOC" class="header-logo"> SIMOC Live</h1>
    <nav>
      <button id="nav-live" class="nav-btn active" data-section="live">Live</button>
      <button id="nav-history" class="nav-btn" data-section="history">History</button>
      <button id="nav-admin" class="nav-btn" data-section="admin" hidden>Admin</button>
    </nav>
  </header>

  <main>
    <!-- Live Dashboard -->
    <section id="section-live">
      <div id="live-status" class="status-line"></div>
      <div id="live-cards" class="cards"></div>
    </section>

    <!-- Historical Data -->
    <section id="section-history" hidden>
      <div class="controls">
        <fieldset id="sensor-selection">
          <legend>Sensors &amp; metrics</legend>
          <!-- populated by JS: one row of toggles per sensor -->
        </fieldset>

        <fieldset>
          <legend>Time range</legend>
          <div class="time-range">
            <label>Dates <input id="date-range" type="text" placeholder="start — end"></label>
            <label>Time (optional)
              <span class="time-inputs">
                <input id="time-start" type="text" placeholder="from">
                <span>—</span>
                <input id="time-end" type="text" placeholder="to">
              </span>
            </label>
          </div>
          <div class="quick-range">
            <button class="toggle" data-range="hour">Last hour</button>
            <button class="toggle" data-range="day">Last day</button>
            <button class="toggle" data-range="week">Last week</button>
            <button class="toggle" data-range="month">Last month</button>
            <button class="toggle" data-range="all">All data</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Export</legend>
          <div class="export-controls">
            <select id="export-format">
              <option value="csv">CSV</option>
              <option value="json">JSON</option>
            </select>
            <button id="btn-export-visible">Export visible</button>
            <button id="btn-export-full">Export full range</button>
          </div>
        </fieldset>

        <button id="btn-query" class="primary btn-query-full">↻ Refresh</button>
      </div>

      <div class="status-row">
        <div id="history-status" class="status-line"></div>
        <div id="view-mode-switch" class="view-mode-switch" hidden>
          <span>Plot</span>
          <label class="switch">
            <input type="checkbox" id="view-mode-toggle">
            <span class="slider"></span>
          </label>
          <span>Table</span>
        </div>
      </div>
      <div id="history-results"></div>
    </section>

    <!-- Admin Interface -->
    <section id="section-admin" hidden>

      <!-- Config Editor -->
      <div class="admin-panel">
        <div class="admin-panel-header">
          <h2>Configuration</h2>
          <button id="btn-admin-logout" class="toggle" hidden>Log out</button>
        </div>
        <div id="admin-config-status" class="status-line"></div>
        <div id="admin-config-form"></div>
        <div class="admin-save-row">
          <button id="btn-save-config" class="primary">Save</button>
          <span id="admin-no-config-hint" class="status-line" hidden>Saving will create the config file.</span>
          <span id="admin-dirty-warning" class="admin-dirty-warning" hidden>Unsaved changes</span>
          <span id="admin-save-status" class="status-line"></span>
          <span id="admin-apply-hint" class="status-line" hidden></span>
        </div>
      </div>

      <!-- Commands -->
      <div class="admin-panel">
        <h2>Commands</h2>
        <div id="admin-commands-status" class="status-line"></div>
        <div id="admin-command-groups"></div>
        <div id="admin-output-wrap" hidden>
          <div class="admin-output-header">
            <span id="admin-output-title">Output</span>
            <button id="btn-clear-output" class="toggle">Clear</button>
          </div>
          <pre id="admin-output"></pre>
        </div>
      </div>

    </section>
  </main>

  <dialog id="modal">
    <p id="modal-message"></p>
    <form method="dialog">
      <button class="primary">OK</button>
    </form>
  </dialog>

  <dialog id="admin-login-modal">
    <form id="admin-login-form">
      <h2>Admin access</h2>
      <p>Enter the local admin password to continue.</p>
      <label for="admin-password">Password</label>
      <input id="admin-password" type="password" autocomplete="current-password" required>
      <p id="admin-login-error" class="dialog-error" hidden></p>
      <div class="dialog-actions">
        <button id="btn-admin-login-cancel" type="button" class="toggle">Cancel</button>
        <button type="submit" class="primary">Log in</button>
      </div>
    </form>
  </dialog>

  <script src="vendor/chart.umd.js"></script>
  <script src="vendor/chartjs-adapter-date-fns.js"></script>
  <script src="vendor/flatpickr.js"></script>
  <script src="app.js"></script>
</body>
</html>
